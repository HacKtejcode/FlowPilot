
services:
  docker:
    image: docker:27-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - "--host=tcp://0.0.0.0:2375"
      - "--host=unix:///var/run/docker.sock"
    volumes:
      - docker_data_recovery:/var/lib/docker

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: flowpilot-jenkins
    restart: unless-stopped
    depends_on:
      - docker
    ports:
      - "8081:8080"
      - "50000:50000"
    environment:
      DOCKER_HOST: tcp://docker:2375
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:
  docker_data:
  docker_data_recovery:
