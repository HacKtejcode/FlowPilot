apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: flowpilot
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "flowpilot"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["flowpilot-service.flowpilot.svc.cluster.local:80"]
